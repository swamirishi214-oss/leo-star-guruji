<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>Leo Star Guruji</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f5f7ff;font-family:-apple-system,BlinkMacSystemFont,Arial}.wrap{max-width:600px;margin:auto;padding:22px 16px 30px}.brand{font-size:28px;font-weight:800}.sub{color:#9da8c5;font-size:13px;margin:4px 0 16px}.card{background:#151d33;border:1px solid #293451;border-radius:18px;padding:16px;margin:12px 0}label{display:block;color:#aeb8d2;font-size:13px;margin:12px 0 6px}input,textarea{width:100%;padding:13px;border-radius:12px;border:1px solid #34415f;background:#0e1528;color:#fff;font-size:16px}button{width:100%;border:0;border-radius:13px;padding:14px;background:#7c5cff;color:white;font-weight:700;font-size:16px;margin-top:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pill{display:inline-block;padding:6px 9px;border-radius:99px;background:#24304b;margin:3px;font-size:12px}.hidden{display:none}pre{white-space:pre-wrap;line-height:1.5;font-family:inherit}</style></head><body><div class="wrap"><div class="brand">♌ Leo Star</div><div class="sub">Guruji Prediction Workbench • Internal</div><div class="card"><h3>New Prediction</h3><label>DOB</label><input id="dob" type="date"><label>Birth Time</label><input id="time" type="time"><label>Birth Place</label><input id="place" placeholder="Jabalpur, Madhya Pradesh"><div class="grid"><div><label>Latitude</label><input id="lat" type="number" step=".0001"></div><div><label>Longitude</label><input id="lon" type="number" step=".0001"></div></div><label>Question</label><textarea id="q" rows="3" placeholder="Career promotion ka strong period kab hai?"></textarea><button onclick="analyse()">Analyse Chart</button></div><div id="out" class="hidden"><div class="card"><h3>Evidence Layers</h3><div id="tags"></div></div><div class="card"><h3>Guruji Review</h3><pre id="report"></pre></div><div class="card"><h3>Final Verdict</h3><textarea rows="4" placeholder="Guruji ka final judgement..."></textarea><button onclick="alert('Saved locally in demo. Production backend connection required.')">Save Case</button></div></div><div class="card" style="font-size:12px;color:#9da8c5">Mobile UI is ready. Exact planetary positions, dasha dates and timing must come from the deterministic Leo Star backend; this interface never invents them.</div></div><script>function analyse(){let x=q.value.toLowerCase(),e='career',f=['D1','10H','10L','D10','Vimshottari Dasha','Transit','KP'];if(x.includes('marriage')||x.includes('shaadi')){e='marriage';f=['D1','7H','2H','11H','D9','Dasha','Transit','KP']}else if(x.includes('money')||x.includes('paisa')||x.includes('finance')){e='money';f=['D1','2H','5H','9H','11H','Dasha','Transit','Ashtakavarga']}else if(x.includes('property')||x.includes('ghar')){e='property';f=['D1','4H','2H','11H','D4','Dasha','Transit']}else if(x.includes('foreign')||x.includes('abroad')){e='foreign';f=['D1','9H','12H','7H','D4','Dasha','Transit']}tags.innerHTML=f.map(a=>'<span class="pill">'+a+'</span>').join('');report.textContent='Birth: '+dob.value+' '+time.value+'\nPlace: '+place.value+'\n\nEvent: '+e+'\n\nEvidence required:\n'+f.map(a=>'• '+a).join('\n')+'\n\nSTATUS: GURUJI REVIEW REQUIRED';out.classList.remove('hidden');out.scrollIntoView({behavior:'smooth'})}</script></body></html>
